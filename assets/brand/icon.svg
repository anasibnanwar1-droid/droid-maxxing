<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- DROIDEX app icon: pixel DX monogram on cream.
       Full-canvas macOS tile with transparent rounded corners. Silkscreen-style
       5-row pixel glyphs on an 80px grid (D 5 cols, 1-col gap, X 5 cols;
       content 880x400 centered). D in ink, X in safety orange. -->
  <rect width="1024" height="1024" rx="228" fill="#F2EFE9" />

  <!-- D, ink -->
  <g fill="#141310">
    <rect x="72" y="312" width="80" height="80" />
    <rect x="152" y="312" width="80" height="80" />
    <rect x="232" y="312" width="80" height="80" />
    <rect x="312" y="312" width="80" height="80" />
    <rect x="72" y="392" width="80" height="80" />
    <rect x="392" y="392" width="80" height="80" />
    <rect x="72" y="472" width="80" height="80" />
    <rect x="392" y="472" width="80" height="80" />
    <rect x="72" y="552" width="80" height="80" />
    <rect x="392" y="552" width="80" height="80" />
    <rect x="72" y="632" width="80" height="80" />
    <rect x="152" y="632" width="80" height="80" />
    <rect x="232" y="632" width="80" height="80" />
    <rect x="312" y="632" width="80" height="80" />
  </g>

  <!-- X, safety orange -->
  <g fill="#FF4D00">
    <rect x="552" y="312" width="80" height="80" />
    <rect x="872" y="312" width="80" height="80" />
    <rect x="632" y="392" width="80" height="80" />
    <rect x="792" y="392" width="80" height="80" />
    <rect x="712" y="472" width="80" height="80" />
    <rect x="632" y="552" width="80" height="80" />
    <rect x="792" y="552" width="80" height="80" />
    <rect x="552" y="632" width="80" height="80" />
    <rect x="872" y="632" width="80" height="80" />
  </g>
</svg>
