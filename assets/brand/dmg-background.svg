<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <!-- DROIDEX DMG installer window background (600x400, rendered @1x and @2x).
       Finder icon positions are CENTERS: .app at (132,150), Applications link
       at (372,150), icon size 96 (so icons span x 84-180 and x 324-420).
       The arrow lives in the free gap between them (x 180-324, y 150).
       Labels must stay readable at Finder's 1x scale: medium weight, strong
       contrast, and the footer clear of the window's bottom edge. -->
  <rect width="600" height="400" fill="#F2EFE9" />

  <!-- top metadata row -->
  <text x="48" y="52" font-family="'JetBrains Mono', monospace" font-weight="500" font-size="11.5"
    letter-spacing="1.6" fill="#141310" fill-opacity="0.9">DRX-INSTALL / MACOS</text>
  <text x="552" y="52" text-anchor="end" font-family="'JetBrains Mono', monospace" font-weight="400"
    font-size="11.5" letter-spacing="1.6" fill="#141310" fill-opacity="0.55">DRX-2026-INSTALL-01</text>

  <!-- drag arrow in the gap between the two icons, aligned to icon centers -->
  <g stroke="#141310" stroke-opacity="0.9" stroke-width="2" fill="none">
    <line x1="196" y1="150" x2="304" y2="150" />
    <path d="M 296 144 L 304 150 L 296 156" />
  </g>
  <text x="252" y="176" text-anchor="middle" font-family="'JetBrains Mono', monospace"
    font-weight="500" font-size="10" letter-spacing="1.8" fill="#141310" fill-opacity="0.7">DRAG TO INSTALL</text>

  <!-- footer, clear of the window edge -->
  <line x1="48" y1="332" x2="552" y2="332" stroke="#141310" stroke-opacity="0.2" stroke-width="1" />
  <text x="300" y="356" text-anchor="middle" font-family="'JetBrains Mono', monospace"
    font-weight="500" font-size="10.5" letter-spacing="1.6" fill="#141310" fill-opacity="0.85">DROIDEX · DESKTOP COCKPIT FOR AI AGENTS</text>
</svg>
