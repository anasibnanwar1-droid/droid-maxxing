name: Release macOS

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-macos-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CI: true
  NODE_VERSION: '22'
  RELEASE_REPOSITORY: anasibnanwar1-droid/droidex-releases

jobs:
  release:
    name: Sign, notarize, and publish
    runs-on: macos-15
    timeout-minutes: 60
    environment: macos-release
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            sidecar/package-lock.json

      - name: Validate release identity
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          test "$GITHUB_REF_NAME" = "v$PACKAGE_VERSION"
          git tag --points-at HEAD --list "$GITHUB_REF_NAME" | grep -Fx "$GITHUB_REF_NAME"
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main

      - name: Install locked dependencies
        run: |
          npm ci
          npm ci --prefix sidecar

      - name: Run release gates
        run: |
          npm run format:check
          npm run docs:check
          npm run typecheck
          npm run sidecar:typecheck
          npm run electron:check
          npm run test
          npm --prefix sidecar run test
          npm audit --omit=dev
          npm audit --omit=dev --prefix sidecar

      - name: Materialize notarization key
        env:
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          test -n "$APPLE_API_KEY_P8_BASE64"
          printf '%s' "$APPLE_API_KEY_P8_BASE64" | base64 -D > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"

      - name: Build signed and notarized artifacts
        env:
          DROIDEX_RELEASE_BUILD: '1'
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ runner.temp }}/AuthKey.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: npm run dist:mac

      - name: Verify release artifacts
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run release:verify:mac -- release --signed --write-checksums

      - name: Retain verified artifacts privately
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: droidex-${{ github.ref_name }}-macos
          if-no-files-found: error
          path: |
            release/droidex-*.dmg
            release/droidex-*.dmg.blockmap
            release/droidex-*.zip
            release/droidex-*.zip.blockmap
            release/latest-mac.yml
            release/SHA256SUMS

      - name: Publish atomic public GitHub release
        env:
          GH_TOKEN: ${{ secrets.DROIDEX_RELEASE_TOKEN }}
        run: |
          test "$(gh api \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/$RELEASE_REPOSITORY/immutable-releases" \
            --jq '.enabled')" = "true"
          if gh release view "$GITHUB_REF_NAME" --repo "$RELEASE_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists in $RELEASE_REPOSITORY" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" \
            release/droidex-*.dmg \
            release/droidex-*.dmg.blockmap \
            release/droidex-*.zip \
            release/droidex-*.zip.blockmap \
            release/latest-mac.yml \
            release/SHA256SUMS \
            --repo "$RELEASE_REPOSITORY" \
            --target main \
            --title "DROIDEX $GITHUB_REF_NAME" \
            --notes "Signed and notarized DROIDEX macOS release for Apple silicon and Intel Macs. Download the DMG matching your Mac."
          gh release verify "$GITHUB_REF_NAME" --repo "$RELEASE_REPOSITORY"

      - name: Remove notarization key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
