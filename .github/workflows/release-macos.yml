name: Release macOS

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-macos-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CI: true
  NODE_VERSION: '22'
  RELEASE_REPOSITORY: droidex-anas/droidex-releases

jobs:
  release:
    name: Verify and publish macOS release
    runs-on: macos-15
    timeout-minutes: 60
    environment: macos-release
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            sidecar/package-lock.json

      - name: Validate release identity
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          test "$GITHUB_REF_NAME" = "v$PACKAGE_VERSION"
          git tag --points-at HEAD --list "$GITHUB_REF_NAME" | grep -Fx "$GITHUB_REF_NAME"
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main

      - name: Install locked dependencies
        run: |
          npm ci
          npm ci --prefix sidecar

      - name: Run release gates
        run: |
          npm run format:check
          npm run docs:check
          npm run typecheck
          npm run sidecar:typecheck
          npm run electron:check
          npm run test
          npm --prefix sidecar run test
          npm run quality:file-size
          npm run quality:tech-debt
          npm run quality:boundaries
          npm run quality:deps
          npm run quality:deadcode
          npm run quality:duplicates
          npm run security:audit-report

      - name: Build ad-hoc-signed macOS artifacts
        env:
          DROIDEX_UNSIGNED_RELEASE_BUILD: '1'
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: npm run dist:mac

      - name: Sign Sparkle feeds and verify artifacts
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          npm run sparkle:appcast -- release
          npm run release:verify:mac -- release --write-checksums

      - name: Run unsigned release preflight
        env:
          GH_TOKEN: ${{ github.token }}
          DROIDEX_RELEASE_GH_TOKEN: ${{ secrets.DROIDEX_RELEASE_TOKEN }}
        run: npm run release:preflight:unsigned

      - name: Retain verified artifacts privately
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: droidex-${{ github.ref_name }}-macos
          if-no-files-found: error
          path: |
            release/droidex-arm64.dmg
            release/droidex-arm64.zip
            release/droidex-x64.dmg
            release/droidex-x64.zip
            release/appcast-arm64.xml
            release/appcast-x64.xml
            release/SHA256SUMS

      - name: Publish immutable public GitHub release
        env:
          GH_TOKEN: ${{ secrets.DROIDEX_RELEASE_TOKEN }}
        run: |
          test "$(gh api \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/$RELEASE_REPOSITORY/immutable-releases" \
            --jq '.enabled')" = "true"
          gh release verify-asset --help >/dev/null
          if gh release view "$GITHUB_REF_NAME" --repo "$RELEASE_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists in $RELEASE_REPOSITORY" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --repo "$RELEASE_REPOSITORY" \
            --target main \
            --title "DROIDEX $GITHUB_REF_NAME" \
            --notes "Ad-hoc-signed DROIDEX macOS release for Apple silicon and Intel Macs. First launch requires approval in Privacy & Security. Download the DMG matching your Mac."
          touch "$RUNNER_TEMP/droidex-draft-created"
          gh release upload "$GITHUB_REF_NAME" \
            release/droidex-arm64.dmg \
            release/droidex-arm64.zip \
            release/droidex-x64.dmg \
            release/droidex-x64.zip \
            release/appcast-arm64.xml \
            release/appcast-x64.xml \
            release/SHA256SUMS \
            --repo "$RELEASE_REPOSITORY"

          for asset in \
            release/droidex-arm64.dmg \
            release/droidex-arm64.zip \
            release/droidex-x64.dmg \
            release/droidex-x64.zip \
            release/appcast-arm64.xml \
            release/appcast-x64.xml \
            release/SHA256SUMS; do
            NAME="${asset##*/}"
            LOCAL_DIGEST="$(shasum -a 256 "$asset" | awk '{print $1}')"
            REMOTE_DIGEST="$(gh release view "$GITHUB_REF_NAME" \
              --repo "$RELEASE_REPOSITORY" \
              --json assets \
              --jq '.assets[] | select(.name == "'"$NAME"'") | .digest')"
            test "sha256:$LOCAL_DIGEST" = "$REMOTE_DIGEST"
          done

          gh release edit "$GITHUB_REF_NAME" --repo "$RELEASE_REPOSITORY" --draft=false
          gh release verify "$GITHUB_REF_NAME" --repo "$RELEASE_REPOSITORY"
          for asset in \
            release/droidex-arm64.dmg \
            release/droidex-arm64.zip \
            release/droidex-x64.dmg \
            release/droidex-x64.zip \
            release/appcast-arm64.xml \
            release/appcast-x64.xml \
            release/SHA256SUMS; do
            gh release verify-asset "$GITHUB_REF_NAME" "$asset" --repo "$RELEASE_REPOSITORY"
          done

      - name: Remove an incomplete workflow-owned draft
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.DROIDEX_RELEASE_TOKEN }}
        run: |
          if test -f "$RUNNER_TEMP/droidex-draft-created" && \
            test "$(gh release view "$GITHUB_REF_NAME" \
              --repo "$RELEASE_REPOSITORY" \
              --json isDraft --jq '.isDraft')" = "true"; then
            gh release delete "$GITHUB_REF_NAME" \
              --repo "$RELEASE_REPOSITORY" \
              --cleanup-tag \
              --yes
          fi
